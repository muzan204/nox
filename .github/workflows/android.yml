name: Build NOX APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NOX APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -eux
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" version

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/NOX.apk

      - name: Upload NOX.apk
        uses: actions/upload-artifact@v4
        with:
          name: NOX-apk
          path: dist/NOX.apk
          if-no-files-found: error
          retention-days: 30
