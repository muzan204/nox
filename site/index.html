<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="NOX — assistente por voz com olhos e boca em neon, usando Qwen3.8-27B na nuvem.">
<title>NOX — Qwen na nuvem</title>
<style>
:root{color-scheme:dark;--cyan:#00f5f5;--mint:#5eead4;--white:#f4ffff;--muted:#89a9aa;--panel:#071313;--line:#164448}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#000;color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{width:min(100%,760px);display:flex;align-items:center;justify-content:space-between;padding:18px 2px 8px}
.brand{font-weight:800;letter-spacing:.22em;color:var(--mint);font-size:1rem}
.status{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:#536767;box-shadow:0 0 8px #536767}
.dot.online{background:var(--mint);box-shadow:0 0 10px var(--mint)}
main{width:min(100%,760px);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:10px 0 18px}
.face{position:relative;width:min(94vw,650px);height:clamp(230px,43vh,390px);display:flex;align-items:center;justify-content:center;gap:clamp(30px,9vw,100px);isolation:isolate}
.eye{position:relative;width:clamp(90px,22vw,190px);height:clamp(125px,29vw,240px);border-radius:50%;background:radial-gradient(ellipse at 48% 42%,#071b20 0 35%,#003c43 60%,#00e9ef 77%,#00ffff 83%,#003a40 91%,#000 100%);box-shadow:0 0 14px #00f5f566,0 0 45px #00f5f533,inset 0 0 18px #00ffff77;animation:blink 6s infinite;overflow:hidden}
.eye:before{content:"";position:absolute;width:34%;height:34%;left:25%;top:23%;border-radius:50%;background:var(--white);box-shadow:0 0 20px #fff}
.eye:after{content:"";position:absolute;width:12%;height:12%;right:19%;bottom:28%;border-radius:50%;background:#aaffff;box-shadow:0 0 12px #00ffff}
.eye:nth-child(2){animation-delay:.12s}
.face.listening .eye{box-shadow:0 0 24px #00f5f5aa,0 0 65px #00f5f555,inset 0 0 22px #00ffff99}
.brow{position:absolute;top:4%;width:30%;height:clamp(8px,1.6vw,15px);border-radius:100% 100% 20% 20%;background:var(--cyan);box-shadow:0 0 12px #00ffff,0 0 34px #00ffff66}
.brow.left{left:6%;transform:rotate(-16deg)}
.brow.right{right:6%;transform:rotate(16deg)}
.mouth{position:absolute;left:50%;bottom:7%;width:clamp(95px,18vw,180px);height:clamp(28px,5vw,48px);transform:translateX(-50%);border-bottom:clamp(4px,.7vw,7px) solid var(--cyan);border-radius:0 0 50% 50%;filter:drop-shadow(0 0 8px #00ffff) drop-shadow(0 0 20px #00ffff66);transition:height .12s,border-radius .12s}
.face.speaking .mouth{height:clamp(24px,6vw,58px);border:3px solid var(--cyan);border-radius:45%;background:repeating-linear-gradient(0deg,transparent 0 5px,#00ffff 6px 8px,transparent 9px 12px);animation:talk .18s infinite alternate}
@keyframes talk{from{transform:translateX(-50%) scaleY(.65)}to{transform:translateX(-50%) scaleY(1.1)}}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.06)}}
#reply{width:100%;min-height:44px;max-height:22vh;overflow:auto;text-align:center;color:#d8f3e8;line-height:1.55;font-size:.96rem;padding:0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
#reply:empty:before{content:"Toque no microfone ou escreva para conversar";color:#648486}
.composer{width:min(100%,700px);display:flex;gap:8px;align-items:center;background:#071313;border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 0 28px #00ffff0a}
#message{flex:1;min-width:0;background:transparent;color:var(--white);border:0;outline:0;font:inherit;padding:10px 8px}
#message::placeholder{color:#6e8b8d}
.btn{flex-shrink:0;width:44px;height:44px;border-radius:14px;border:1px solid #1d5558;background:#0a2021;color:var(--mint);display:grid;place-items:center;font-size:1.2rem;cursor:pointer}
.btn:focus-visible,#message:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--cyan);color:#001314;border-color:var(--cyan);font-weight:800}
.btn:disabled{opacity:.45;cursor:wait}
.tools{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tool{background:transparent;border:0;color:#8aa7a8;font:inherit;font-size:.78rem;padding:8px;cursor:pointer}
.tool:hover{color:var(--mint)}
#notice{min-height:18px;text-align:center;color:#89a9aa;font-size:.78rem;padding:4px}
footer{width:min(100%,760px);text-align:center;color:#426264;font-size:.7rem;padding:12px 0 18px}
@media(max-height:650px){main{gap:8px}.face{height:clamp(180px,38vh,260px)}.eye{height:clamp(95px,24vh,170px)}#reply{max-height:14vh}}
@media(prefers-reduced-motion:reduce){.eye,.face.speaking .mouth{animation:none}}
</style>
</head>
<body>
<header>
  <div class="brand">NOX</div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">pronto para conversar</span></div>
</header>
<main>
  <section class="face" id="face" aria-label="Rosto digital do NOX">
    <span class="brow left"></span><span class="brow right"></span>
    <div class="eye"></div><div class="eye"></div>
    <div class="mouth"></div>
  </section>
  <div id="reply" role="status" aria-live="polite"></div>
  <form class="composer" id="form">
    <button class="btn" id="mic" type="button" aria-label="Falar com NOX" title="Falar">🎙</button>
    <input id="message" autocomplete="off" maxlength="4000" placeholder="Fale ou escreva para o NOX…" aria-label="Mensagem para o NOX">
    <button class="btn" id="send" type="submit" aria-label="Enviar mensagem" title="Enviar">➤</button>
  </form>
  <div class="tools">
    <button class="tool" id="voice" type="button">🔊 Voz ativada</button>
    <button class="tool" id="clear" type="button">Limpar conversa</button>
  </div>
  <div id="notice" role="status" aria-live="polite">A IA funciona pela nuvem; a chave fica no servidor.</div>
</main>
<footer>NOX • Qwen3.8-27B na nuvem • Voz depende do suporte do navegador</footer>
<script>
(function(){
  const form=document.getElementById("form"), input=document.getElementById("message");
  const sendButton=document.getElementById("send"), micButton=document.getElementById("mic");
  const reply=document.getElementById("reply"), status=document.getElementById("status");
  const notice=document.getElementById("notice"), face=document.getElementById("face");
  const dot=document.getElementById("dot"), voiceButton=document.getElementById("voice");
  const clearButton=document.getElementById("clear");
  const STORAGE_KEY="nox-qwen-chat-v1";
  let history=[];
  try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");if(Array.isArray(saved))history=saved.filter(x=>x&&["user","assistant"].includes(x.role)&&typeof x.content==="string").slice(-12)}catch(_){}
  let voiceEnabled=true, busy=false, recognition=null, listening=false;
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  function setStatus(text,online){status.textContent=text;dot.classList.toggle("online",!!online)}
  function setNotice(text){notice.textContent=text}
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(history.slice(-12)))}catch(_){}}
  function speak(text){
    if(!voiceEnabled||!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(text);
    utterance.lang="pt-BR";utterance.rate=1;utterance.pitch=1;
    utterance.onstart=()=>face.classList.add("speaking");
    utterance.onend=()=>face.classList.remove("speaking");
    utterance.onerror=()=>face.classList.remove("speaking");
    window.speechSynthesis.speak(utterance);
  }
  async function sendMessage(text){
    text=String(text||"").trim();if(!text||busy)return;
    history.push({role:"user",content:text});history=history.slice(-12);save();
    reply.textContent="";setStatus("pensando…",false);setNotice("Conectando ao Qwen na nuvem…");
    busy=true;sendButton.disabled=true;micButton.disabled=true;face.classList.remove("listening");
    try{
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),50000);
      let response;
      try{response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history.slice(-12)}),signal:controller.signal})}
      finally{clearTimeout(timer)}
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.error||"Não foi possível falar com a IA.");
      const answer=String(data.reply||"").trim();if(!answer)throw new Error("A IA retornou uma resposta vazia.");
      history.push({role:"assistant",content:answer});history=history.slice(-12);save();
      reply.textContent=answer;setStatus("online",true);setNotice("Modelo: "+(data.model||"Qwen3.8-27B"));speak(answer);
    }catch(error){
      const message=error.name==="AbortError"?"A resposta demorou demais. Tente novamente.":error.message||"Falha de conexão.";
      reply.textContent=message;setStatus("conexão indisponível",false);setNotice("Confira a conexão e a configuração da API na Vercel.");
    }finally{busy=false;sendButton.disabled=false;micButton.disabled=false;input.focus()}
  }
  form.addEventListener("submit",event=>{event.preventDefault();const value=input.value;input.value="";sendMessage(value)});
  voiceButton.addEventListener("click",()=>{
    voiceEnabled=!voiceEnabled;voiceButton.textContent=voiceEnabled?"🔊 Voz ativada":"🔇 Voz desativada";
    if(!voiceEnabled&&window.speechSynthesis)window.speechSynthesis.cancel();
    face.classList.remove("speaking");
  });
  clearButton.addEventListener("click",()=>{
    history=[];save();reply.textContent="";setNotice("Conversa apagada deste navegador.");setStatus("pronto para conversar",false);
    if(window.speechSynthesis)window.speechSynthesis.cancel();
  });
  if(!SpeechRecognition){
    micButton.disabled=true;micButton.title="Este navegador não oferece reconhecimento de fala.";
    setNotice("Digite sua mensagem. O reconhecimento de fala não está disponível neste navegador.");
  }else{
    recognition=new SpeechRecognition();recognition.lang="pt-BR";recognition.interimResults=false;recognition.maxAlternatives=1;
    recognition.onstart=()=>{listening=true;face.classList.add("listening");micButton.textContent="■";setStatus("ouvindo…",true);setNotice("Pode falar; toque no botão para encerrar.")};
    recognition.onresult=event=>{const text=event.results&&event.results[0]&&event.results[0][0]?event.results[0][0].transcript:"";if(text)input.value=text};
    recognition.onerror=event=>{setNotice(event.error==="not-allowed"?"Permita o microfone nas configurações do navegador.":"Não consegui reconhecer a fala. Tente novamente.");};
    recognition.onend=()=>{listening=false;face.classList.remove("listening");micButton.textContent="🎙";if(!busy)setStatus("pronto para conversar",false);if(input.value.trim()&&!busy){const text=input.value;input.value="";sendMessage(text)}};
    micButton.addEventListener("click",()=>{if(listening){recognition.stop();return}try{recognition.start()}catch(_){setNotice("O microfone já está sendo iniciado. Aguarde um instante.")}});
  }
  if(history.length){const last=history[history.length-1];if(last.role==="assistant")reply.textContent=last.content}
})();
</script>
</body>
</html>
