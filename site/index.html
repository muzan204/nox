<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="NOX — olhos e sorriso em neon.">
<title>NOX</title>
<style>
:root{color-scheme:dark;--cyan:#00f5f5;--white:#f8ffff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
body{display:grid;place-items:center}
.face{width:min(92vw,900px);height:min(76vh,560px);position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(36px,10vw,120px);isolation:isolate}
.eye{position:relative;width:clamp(100px,24vw,230px);height:clamp(150px,34vw,300px);border-radius:50%;background:radial-gradient(ellipse at 48% 42%,#071b20 0 35%,#003c43 60%,#00e9ef 77%,#00ffff 83%,#003a40 91%,#000 100%);box-shadow:0 0 14px #00f5f566,0 0 45px #00f5f533,inset 0 0 18px #00ffff77;animation:blink 6s infinite;overflow:hidden}
.eye:before{content:"";position:absolute;width:34%;height:34%;left:25%;top:23%;border-radius:50%;background:var(--white);box-shadow:0 0 20px #fff}
.eye:after{content:"";position:absolute;width:12%;height:12%;right:19%;bottom:28%;border-radius:50%;background:#aaffff;box-shadow:0 0 12px #00ffff}
.eye:nth-child(2){animation-delay:.12s}
.brow{position:absolute;top:3%;width:31%;height:clamp(10px,2vw,20px);border-radius:100% 100% 20% 20%;background:var(--cyan);box-shadow:0 0 12px #00ffff,0 0 34px #00ffff66}
.brow.left{left:5%;transform:rotate(-16deg)}
.brow.right{right:5%;transform:rotate(16deg)}
.mouth{position:absolute;left:50%;bottom:8%;width:clamp(100px,18vw,210px);height:clamp(35px,6vw,65px);transform:translateX(-50%);border-bottom:clamp(5px,.7vw,8px) solid var(--cyan);border-radius:0 0 50% 50%;filter:drop-shadow(0 0 8px #00ffff) drop-shadow(0 0 20px #00ffff66)}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.06)}}
@media(prefers-reduced-motion:reduce){.eye{animation:none}}
</style>
</head>
<body>
<main class="face" role="img" aria-label="Olhos e boca do NOX em neon azul sobre fundo preto">
<span class="brow left"></span><span class="brow right"></span>
<div class="eye"></div><div class="eye"></div>
<div class="mouth"></div>
</main>
</body>
</html>
